aid: compstak
name: Compstak
description: >-
  CompStak is a commercial real estate (CRE) data platform, founded in 2012,
  that crowdsources and verifies lease comps, sale comps, loan data, and
  property data from a network of tens of thousands of brokers and appraisers
  across US markets. Its products include CompStak One (an all-in-one CRE data
  platform), CompStak Exchange, CompStak AI, and a contact-sales Data API
  offering Market Insights, Property Insights, Space Insights, and Property
  Standardization. CompStak was surfaced as a portfolio company of 500 Global
  and Canaan Partners and added to the API Evangelist network. Its developer
  surface is enterprise/contact-sales only — there is no public self-serve
  developer portal, OpenAPI specification, SDK, or API reference.
